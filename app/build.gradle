plugins { id 'com.android.application' }

android {
    namespace 'com.study.quadtap'
    compileSdk 35

    defaultConfig {
        applicationId 'com.study.quadtap'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    compileOptions {
        // 代码里用了 lambda 与方法引用，显式声明避免依赖 AGP 的默认值。
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
