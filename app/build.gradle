plugins { id 'com.android.application' }

// 正式签名所需的四个值从环境变量读取（CI 里由 GitHub Secrets 注入）。
// 任何一个缺失就跳过签名配置 —— 构建照常可用，只是产出 debug 签名的 APK。
def keystorePath = System.getenv('QUADTAP_KEYSTORE_FILE')
def keystorePassword = System.getenv('QUADTAP_KEYSTORE_PASSWORD')
def keyAliasName = System.getenv('QUADTAP_KEY_ALIAS')
def keyPasswordValue = System.getenv('QUADTAP_KEY_PASSWORD')

def hasReleaseSigning = keystorePath != null && !keystorePath.isEmpty()
        && keystorePassword != null && !keystorePassword.isEmpty()
        && keyAliasName != null && !keyAliasName.isEmpty()
        && keyPasswordValue != null && !keyPasswordValue.isEmpty()
        && file(keystorePath).exists()

android {
    namespace 'com.study.quadtap'
    compileSdk 35

    defaultConfig {
        applicationId 'com.study.quadtap'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.11'
    }

    compileOptions {
        // 代码里用了 lambda 与方法引用，显式声明避免依赖 AGP 的默认值。
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    // 只用它的 FileProvider：Android 7 起禁止跨应用传 file:// URI，
    // 应用内更新必须把下载好的 APK 以 content:// 交给系统安装器。
    implementation 'androidx.core:core:1.13.1'

    // androidx.core 会引入较新的 kotlin-stdlib，而 ML Kit 那条依赖链上还挂着旧的
    // kotlin-stdlib-jdk8。Kotlin 1.8 起 jdk7/jdk8 的内容已并入 kotlin-stdlib，
    // 两者同时存在会报 "Duplicate class kotlin.streams.jdk8.StreamsKt" 导致构建失败。
    // 用 BOM 把所有 kotlin 构件对齐到同一版本即可（这是官方推荐的修法）。
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
