name: Release APK

# 打 v* 标签并推送时触发：构建 APK -> 生成校验文件 -> 从 CHANGELOG.md 取说明 -> 发布 Release。
# 使用仓库自带的 GITHUB_TOKEN，不需要配置任何个人令牌。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # 直接用 GitHub 运行器预装的 Android SDK，不依赖 setup-android 去下载命令行工具，
          # 少一个网络环节就少一种偶发失败。
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error title=找不到 Android SDK::路径 $SDK 不存在"
            exit 1
          fi
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          echo "使用 SDK: $SDK"
          sdkmanager --version
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check tag matches versionName
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION="$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)"
          echo "标签版本        : $TAG_VERSION"
          echo "gradle 版本名   : $GRADLE_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::warning title=版本号不一致::标签为 $GITHUB_REF_NAME，但 app/build.gradle 里 versionName 是 $GRADLE_VERSION，装出来的应用会显示 $GRADLE_VERSION"
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare release assets
        run: |
          set -euo pipefail
          NAME="QuadTap-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          sha256sum "$NAME" > SHA256SUMS.txt
          ls -l "$NAME" SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "CHANGELOG.md 中未找到 $VER 段落，改用完整变更记录。"
            cp CHANGELOG.md RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            QuadTap-${{ github.ref_name }}-debug.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
