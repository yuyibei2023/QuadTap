name: Release APK

# 打 v* 标签并推送时触发：构建 APK -> 生成校验文件 -> 从 CHANGELOG.md 取说明 -> 发布 Release。
# 使用仓库自带的 GITHUB_TOKEN，不需要配置任何个人令牌。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # 直接用 GitHub 运行器预装的 Android SDK，不依赖 setup-android 去下载命令行工具，
          # 少一个网络环节就少一种偶发失败。
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error title=找不到 Android SDK::路径 $SDK 不存在"
            exit 1
          fi
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          echo "使用 SDK: $SDK"
          sdkmanager --version
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check tag matches versionName
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION="$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)"
          echo "标签版本        : $TAG_VERSION"
          echo "gradle 版本名   : $GRADLE_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::warning title=版本号不一致::标签为 $GITHUB_REF_NAME，但 app/build.gradle 里 versionName 是 $GRADLE_VERSION，装出来的应用会显示 $GRADLE_VERSION"
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare release assets
        run: |
          set -euo pipefail
          NAME="QuadTap-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          sha256sum "$NAME" > SHA256SUMS.txt
          ls -l "$NAME" SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && (index($0, "## [") == 1 || $0 == "---") { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "CHANGELOG.md 中未找到 $VER 段落，改用完整变更记录。"
            cp CHANGELOG.md RELEASE_NOTES.md
          fi

      - name: Append screenshots to release notes
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(docs/screenshots/*.png docs/screenshots/*.jpg docs/screenshots/*.jpeg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "docs/screenshots/ 下还没有图片，跳过截图区。"
            exit 0
          fi

          # 标题优先取 captions.txt 里的映射，没有就用文件名。
          caption_for() {
            local name="$1" stem="${1%.*}" line
            if [ -f docs/screenshots/captions.txt ]; then
              line="$(grep -m1 "^${name}=" docs/screenshots/captions.txt || true)"
              if [ -n "$line" ]; then printf '%s' "${line#*=}"; return 0; fi
              line="$(grep -m1 "^${stem}=" docs/screenshots/captions.txt || true)"
              if [ -n "$line" ]; then printf '%s' "${line#*=}"; return 0; fi
            fi
            printf '%s' "$stem"
          }

          # 指向 main 而不是标签：这样"先加图片、后发版"也能正常显示。
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/docs/screenshots"
          {
            echo ""
            echo "## 界面截图"
            echo ""
            for f in "${files[@]}"; do
              name="$(basename "$f")"
              echo "![$(caption_for "$name")](${BASE}/${name})"
              echo ""
            done
          } > SCREENSHOTS.md

          cat RELEASE_NOTES.md SCREENSHOTS.md > MERGED.md
          mv MERGED.md RELEASE_NOTES.md
          echo "已追加 ${#files[@]} 张截图"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            QuadTap-${{ github.ref_name }}-debug.apk
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Sync release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # action-gh-release 在 release 已存在时不会刷新说明文字（只更新产物），
          # 重复打同一个标签就会留下旧说明。这里用运行器自带的 gh 强制同步一次。
          gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          echo "--- 最终发布说明 ---"
          gh release view "$GITHUB_REF_NAME" --json tagName,name,url,assets \
            --template '{{.name}}  {{.url}}{{"\n"}}{{range .assets}}  asset: {{.name}} ({{.size}} bytes){{"\n"}}{{end}}'
